<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eeeeec">
<meta name="description" content="capimm · figma — Ícones: pesquise, visualize e baixe.">
<link rel="icon" href="../assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../assets/logo.png">
<title>capimm · figma — Ícones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eeeeec;--ink:#080808;--muted:#555;--glass:rgba(255,255,255,.62);--ease:cubic-bezier(.16,1,.3,1);--size:178px}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;padding:34px 26px 40px;overflow-x:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);position:relative}
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;filter:blur(78px);opacity:.9}
.blob{position:absolute;border-radius:50%;animation:drift 25s ease-in-out infinite alternate;will-change:transform}
.blob.one{width:48vw;height:48vw;min-width:340px;min-height:340px;left:-16%;top:-25%;background:#d1d1ce}
.blob.two{width:42vw;height:42vw;min-width:300px;min-height:300px;right:-13%;bottom:-25%;background:#c4c4c1;animation-direction:alternate-reverse;animation-duration:31s}
.blob.three{width:28vw;height:28vw;min-width:220px;min-height:220px;left:42%;top:36%;background:#888;opacity:.16;animation-duration:36s}
@keyframes drift{to{transform:translate3d(12vw,12vh,0) scale(1.18)}}
main{position:relative;z-index:1;width:min(100%,1180px);margin:0 auto}
/* ---------- hero ---------- */
.hero{position:relative;text-align:center;margin:6px auto 30px;perspective:900px}
.hero-num{position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:clamp(11rem,26vw,19rem);line-height:1;font-weight:800;letter-spacing:-.1em;color:rgba(0,0,0,.04);pointer-events:none;user-select:none;z-index:0}
.hero>*:not(.hero-num){position:relative;z-index:1}
.back{display:inline-flex;align-items:center;gap:9px;margin-bottom:20px;padding:8px 15px;border:1px solid rgba(255,255,255,.9);border-radius:100px;background:rgba(255,255,255,.5);backdrop-filter:blur(12px);color:var(--ink);text-decoration:none;font-size:10px;font-weight:700;letter-spacing:.23em;text-transform:uppercase;transition:transform .5s var(--ease),background .5s,color .5s}
.back:hover{background:#080808;color:#fff;transform:translateX(-4px)}
.logo-wrap{display:grid;place-items:center;margin-bottom:12px;animation:float 7s ease-in-out infinite;transform-style:preserve-3d}
.logo{display:block;width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(0,0,0,.13));transition:filter .5s var(--ease)}
.logo-wrap:hover .logo{filter:drop-shadow(0 22px 28px rgba(0,0,0,.22))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{margin:0 0 12px;font-size:clamp(2.8rem,8vw,5.4rem);line-height:.98;letter-spacing:-.078em;font-weight:800}
.subtitle{margin:0 auto;color:#414141;font-size:clamp(.92rem,2vw,1.04rem);line-height:1.65}
.count{display:inline-block;margin-left:6px;padding:3px 11px;border-radius:100px;background:#080808;color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;vertical-align:1px}
/* ---------- toolbar ---------- */
.toolbar{position:sticky;top:14px;z-index:6;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:0 auto 26px;padding:10px 12px 10px 18px;border:1px solid rgba(255,255,255,.9);border-radius:100px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 22px 48px -22px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.4)}
.search{flex:1 1 220px;display:flex;align-items:center;gap:10px;min-width:0}
.search svg{flex:none;opacity:.55}
.search input{width:100%;border:0;outline:0;background:transparent;font:500 14px Inter,sans-serif;color:var(--ink)}
.search input::placeholder{color:#8a8a88}
.search kbd{flex:none;padding:2px 8px;border:1px solid rgba(0,0,0,.14);border-radius:7px;font:600 11px Inter,sans-serif;color:#666;background:rgba(255,255,255,.6)}
.seg{display:flex;padding:4px;border-radius:100px;background:rgba(0,0,0,.06);position:relative}
.seg button{position:relative;z-index:1;border:0;background:none;padding:8px 14px;border-radius:100px;font:600 12px Inter,sans-serif;color:#555;cursor:pointer;transition:color .4s var(--ease)}
.seg button.on{color:#fff}
.seg .thumb-pill{position:absolute;z-index:0;top:4px;bottom:4px;left:0;border-radius:100px;background:#080808;transition:transform .55s var(--ease),width .55s var(--ease)}
.size{display:flex;align-items:center;gap:10px;color:#555;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding-right:6px}
.size input{width:110px;accent-color:#080808}
/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--size),1fr));gap:18px}
.item{position:relative;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;cursor:pointer;border:1px solid rgba(255,255,255,.9);border-radius:24px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 40px -22px rgba(0,0,0,.14),inset 0 0 0 1px rgba(255,255,255,.4);transform-style:preserve-3d;will-change:transform;transition:box-shadow .7s var(--ease),border-color .7s var(--ease),transform .22s var(--ease);opacity:0;animation:reveal .9s var(--ease) forwards;animation-delay:calc(var(--d,0)*28ms)}
.item:hover,.item:focus-visible{box-shadow:0 34px 56px -24px rgba(0,0,0,.24),inset 0 0 0 1px #fff;border-color:rgba(0,0,0,.1);outline:none}
.thumb{aspect-ratio:1;margin:10px 10px 0;border-radius:16px;display:grid;place-items:center;padding:14px;overflow:hidden;transition:background .5s}
.thumb img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .8s var(--ease);transform:translateZ(0)}
.item:hover .thumb img{transform:scale(1.1) rotate(-2deg)}
.bg-check .thumb{background:repeating-conic-gradient(#e4e4e2 0 25%,#f3f3f1 0 50%) 0 0/16px 16px}
.bg-dark .thumb{background:#0b0b0b}
.bg-light .thumb{background:#fff}
.meta{position:relative;overflow:hidden;margin-top:10px;padding:11px 14px 13px;display:flex;align-items:center;justify-content:space-between;gap:8px;isolation:isolate}
.meta::before{content:"";position:absolute;z-index:-1;inset:102% -2% -50%;border-radius:50% 50% 0 0;background:#050505;transition:inset .8s var(--ease),border-radius .8s var(--ease)}
.item:hover .meta::before,.item:focus-visible .meta::before{inset:-4% -2% -4%;border-radius:0}
.meta b{font-size:12.5px;font-weight:650;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:capitalize;transition:color .5s}
.meta span{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#080808;color:#fff;font-size:14px;transition:transform .7s var(--ease),background .6s,color .6s}
.item:hover .meta b{color:#fff}
.item:hover .meta span{background:#fff;color:#080808;transform:rotate(-45deg)}
.skel{pointer-events:none;animation:none;opacity:1}
.skel .thumb{background:linear-gradient(100deg,#e6e6e4 30%,#f6f6f4 50%,#e6e6e4 70%) 0 0/300% 100%;animation:shimmer 1.4s linear infinite}
.skel .meta{height:50px}.skel .meta::before{display:none}
@keyframes shimmer{to{background-position:-300% 0}}
.empty{grid-column:1/-1;text-align:center;padding:70px 24px;border:1px dashed rgba(0,0,0,.22);border-radius:28px;background:rgba(255,255,255,.4);color:#555;line-height:1.7}
.empty code{padding:2px 8px;border-radius:7px;background:rgba(0,0,0,.07);color:#111;font-weight:600}
/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(238,238,236,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
.lb.open{opacity:1;pointer-events:auto}
.lb-card{position:relative;width:min(100%,760px);display:grid;grid-template-columns:1.25fr 1fr;overflow:hidden;border:1px solid rgba(255,255,255,.95);border-radius:30px;background:rgba(255,255,255,.78);box-shadow:0 50px 90px -30px rgba(0,0,0,.35);transform:translateY(30px) scale(.94);filter:blur(8px);transition:transform .7s var(--ease),filter .7s var(--ease)}
.lb.open .lb-card{transform:none;filter:none}
.lb-view{min-height:340px;display:grid;place-items:center;padding:26px;transition:background .4s}
.lb-view img{max-width:100%;max-height:340px;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(0,0,0,.18));animation:pop .7s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.86) rotate(-4deg)}}
.lb-info{padding:30px 28px;display:flex;flex-direction:column;gap:6px}
.lb-info small{color:#666;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.lb-info h3{margin:0 0 4px;font-size:1.9rem;line-height:1.05;letter-spacing:-.06em;font-weight:750;text-transform:capitalize;word-break:break-word}
.lb-info p{margin:0 0 14px;color:#555;font-size:12.5px}
.lb-info .acts{margin-top:auto;display:grid;gap:9px}
.pbtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;min-height:50px;padding:6px 7px 6px 18px;border:1px solid rgba(0,0,0,.14);border-radius:100px;background:rgba(255,255,255,.55);color:#080808;font:650 13px Inter,sans-serif;text-decoration:none;cursor:pointer;transition:border-color .6s,color .6s}
.pbtn::before{content:"";position:absolute;inset:0;background:#080808;transform:translateY(105%);transition:transform .6s var(--ease)}
.pbtn:hover::before{transform:none}.pbtn:hover{color:#fff;border-color:#080808}
.pbtn i,.pbtn em{position:relative;z-index:1;font-style:normal}
.pbtn em{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:#080808;color:#fff;transition:background .6s,color .6s}
.pbtn:hover em{background:#fff;color:#080808}
.pbtn.solid{background:#080808;color:#fff}.pbtn.solid::before{background:#fff}.pbtn.solid:hover{color:#080808}.pbtn.solid em{background:#fff;color:#080808}.pbtn.solid:hover em{background:#080808;color:#fff}
.lb-x,.lb-nav{position:absolute;z-index:3;width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(0,0,0,.1);border-radius:50%;background:rgba(255,255,255,.85);color:#080808;font-size:18px;cursor:pointer;transition:transform .5s var(--ease),background .4s,color .4s}
.lb-x{right:14px;top:14px}.lb-x:hover{background:#080808;color:#fff;transform:rotate(90deg)}
.lb-nav{top:50%;margin-top:-21px}.lb-nav:hover{background:#080808;color:#fff}.lb-prev{left:14px}.lb-next{right:auto;left:calc(55.55% - 56px)}
.lb-prev:hover{transform:translateX(-3px)}.lb-next:hover{transform:translateX(3px)}
#toast{position:fixed;z-index:40;left:50%;bottom:28px;transform:translate(-50%,40px);opacity:0;padding:12px 22px;border-radius:100px;background:#080808;color:#fff;font-weight:650;font-size:13px;box-shadow:0 20px 40px -14px rgba(0,0,0,.4);transition:.5s var(--ease);pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
/* ---------- misc ---------- */
.reveal{opacity:0;transform:translateY(28px);filter:blur(7px);animation:reveal 1.15s var(--ease) forwards}
.d1{animation-delay:.08s}.d2{animation-delay:.2s}.d3{animation-delay:.34s}.d4{animation-delay:.48s}
@keyframes reveal{to{opacity:1;transform:translateY(0);filter:blur(0)}}
.page-transition{position:fixed;z-index:50;inset:0;pointer-events:none;opacity:0;background:#080808;clip-path:circle(0% at 50% 50%);transition:clip-path .72s var(--ease),opacity .2s ease}
.page-transition.go{opacity:1;clip-path:circle(150% at var(--tx,50%) var(--ty,50%))}
body.leaving main{filter:blur(5px);transform:scale(.985);opacity:.35;transition:filter .45s,transform .55s var(--ease),opacity .4s}
.cursor-glass{position:fixed;z-index:5;left:0;top:0;width:66px;height:66px;border-radius:50%;pointer-events:none;background:rgba(0,0,0,.12);backdrop-filter:blur(9px);mix-blend-mode:multiply;transform:translate(-50%,-50%);transition:width .4s var(--ease),height .4s var(--ease),background .4s;opacity:0}
.cursor-glass.active{width:105px;height:105px;background:rgba(0,0,0,.27)}
@media(hover:hover) and (pointer:fine){.cursor-glass{opacity:1}}
.footer{margin:46px auto 0;text-align:center;color:#666;font-size:11px}
.footer a{color:#111;text-decoration:none;font-weight:650;border-bottom:1px solid #aaa;padding-bottom:3px}
@media(max-width:760px){body{padding:26px 14px 30px}.toolbar{border-radius:26px;padding:12px 14px;top:8px}.size{display:none}.grid{gap:12px;--size:140px}.lb-card{grid-template-columns:1fr}.lb-view{min-height:230px}.lb-view img{max-height:220px}.cursor-glass{display:none}.lb-nav{top:112px}.lb-next{left:auto;right:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.cursor-glass{display:none}}
</style>
</head>
<body data-folder="icones" data-title="Ícones">
<div class="ambient" aria-hidden="true"><div class="blob one"></div><div class="blob two"></div><div class="blob three"></div></div>
<div class="cursor-glass" id="cursorGlass" aria-hidden="true"></div>
<div class="page-transition" id="pageTransition" aria-hidden="true"></div>

<main>
  <header class="hero">
    <span class="hero-num" aria-hidden="true">02</span>
    <a class="back reveal d1" id="back" href="../index.html">← capimm · figma</a>
    <div class="logo-wrap reveal d1"><img class="logo" src="../assets/logo.png" alt="Logo Capimm"></div>
    <h1 class="reveal d2">Ícones</h1>
    <p class="subtitle reveal d3">Pesquise, visualize e baixe. Clique em um item para ver detalhes.<span class="count" id="count">…</span></p>
  </header>

  <div class="toolbar reveal d3">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Pesquisar ícones…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </label>
    <div class="seg" id="seg" role="group" aria-label="Fundo da pré-visualização">
      <i class="thumb-pill" id="pill"></i>
      <button data-bg="check" class="on">Xadrez</button><button data-bg="dark">Escuro</button><button data-bg="light">Claro</button>
    </div>
    <label class="size">Tamanho <input type="range" id="size" min="120" max="280" value="178"></label>
  </div>

  <section class="grid bg-check" id="grid" aria-live="polite"></section>
  <footer class="footer reveal d4"><a href="https://capimmm.github.io/capimm-figma/" target="_blank" rel="noopener noreferrer">capimmm.github.io/capimm-figma</a></footer>
</main>

<div class="lb" id="lb" aria-hidden="true">
  <div class="lb-card" role="dialog" aria-modal="true" aria-label="Detalhes">
    <button class="lb-x" id="lbX" aria-label="Fechar">✕</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Anterior">←</button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Próximo">→</button>
    <div class="lb-view" id="lbView"><img id="lbImg" alt=""></div>
    <div class="lb-info">
      <small>Ícones</small><h3 id="lbName"></h3><p id="lbMeta"></p>
      <div class="acts">
        <button class="pbtn solid" id="lbCopy"><i>Copiar link</i><em>⧉</em></button>
        <button class="pbtn" id="lbCopyName"><i>Copiar nome</i><em>Aa</em></button>
        <a class="pbtn" id="lbDl" download target="_blank" rel="noopener"><i>Baixar</i><em>↓</em></a>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
(() => {
  const REPO = 'capimmm/capimm-figma', BRANCH = 'main';
  const RAW = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/`;
  const folder = document.body.dataset.folder, title = document.body.dataset.title;
  const $ = (s) => document.querySelector(s);
  const grid = $('#grid');
  let items = [], view = [], cur = -1, bg = 'check';
  const url = (it) => RAW + folder + '/' + encodeURIComponent(it.file);
  const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- dados ---------- */
  async function load() {
    for (const t of [() => fetch('index.json', { cache: 'no-cache' }), () => fetch(RAW + folder + '/index.json', { cache: 'no-cache' })]) {
      try { const r = await t(); if (r.ok) { const j = await r.json(); if (Array.isArray(j)) return j; } } catch (e) {}
    }
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${folder}?ref=${BRANCH}`);
    if (!r.ok) throw new Error('GitHub respondeu ' + r.status);
    return (await r.json()).filter((f) => f.type === 'file' && /\.(png|jpe?g|webp|svg|gif)$/i.test(f.name))
      .map((f) => ({ name: f.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' '), file: f.name }));
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function skeleton() { grid.innerHTML = Array.from({ length: 12 }, () => '<div class="item skel"><div class="thumb"></div><div class="meta"></div></div>').join(''); }

  function render() {
    const q = $('#q').value.trim().toLowerCase();
    view = items.filter((i) => (i.name + ' ' + i.file).toLowerCase().includes(q));
    $('#count').textContent = q ? `${view.length} de ${items.length}` : `${items.length} disponíveis`;
    grid.className = 'grid bg-' + bg;
    if (!items.length) { grid.innerHTML = `<div class="empty">Nenhum arquivo em <code>${folder}/</code> ainda.<br>Adicione imagens (png, jpg, webp, svg) nessa pasta e faça push — a lista aparece sozinha.</div>`; return; }
    if (!view.length) { grid.innerHTML = `<div class="empty">Nada encontrado para <code>${esc(q)}</code>.</div>`; return; }
    grid.innerHTML = view.map((it, i) => `
      <article class="item" tabindex="0" data-i="${i}" style="--d:${Math.min(i, 30)}" aria-label="${esc(it.name)}">
        <div class="thumb"><img loading="lazy" decoding="async" src="${url(it)}" alt=""></div>
        <div class="meta"><b>${esc(it.name)}</b><span aria-hidden="true">↗</span></div>
      </article>`).join('');
  }

  /* ---------- barra de ferramentas ---------- */
  function movePill() { const b = document.querySelector('#seg button.on'), p = $('#pill'); p.style.width = b.offsetWidth + 'px'; p.style.transform = `translateX(${b.offsetLeft - 4}px)`; }
  $('#seg').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('#seg button').forEach((x) => x.classList.toggle('on', x === b)); bg = b.dataset.bg; movePill(); grid.className = 'grid bg-' + bg; $('#lbView').style.background = bgCss(); };
  $('#q').oninput = render;
  $('#size').oninput = (e) => document.documentElement.style.setProperty('--size', e.target.value + 'px');
  addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== $('#q') && !$('#lb').classList.contains('open')) { e.preventDefault(); $('#q').focus(); }
    if ($('#lb').classList.contains('open')) { if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); }
  });
  addEventListener('resize', movePill);

  /* ---------- toast ---------- */
  function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 1500); }
  const copy = (text, msg) => (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast(msg), () => { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast(msg); } catch (e) { toast(text); } t.remove(); });

  /* ---------- lightbox ---------- */
  const bgCss = () => bg === 'dark' ? '#0b0b0b' : bg === 'light' ? '#fff' : 'repeating-conic-gradient(#e4e4e2 0 25%,#f3f3f1 0 50%) 0 0/16px 16px';
  function openLb(i) {
    cur = i; const it = view[i], im = $('#lbImg');
    $('#lbView').style.background = bgCss();
    im.style.animation = 'none'; void im.offsetWidth; im.style.animation = '';
    im.src = url(it); $('#lbName').textContent = it.name; $('#lbMeta').textContent = it.file;
    im.onload = () => { $('#lbMeta').textContent = `${it.file} · ${im.naturalWidth}×${im.naturalHeight}px`; };
    const d = $('#lbDl'); d.href = url(it); d.setAttribute('download', it.file);
    $('#lb').classList.add('open'); $('#lb').setAttribute('aria-hidden', 'false');
  }
  function closeLb() { $('#lb').classList.remove('open'); $('#lb').setAttribute('aria-hidden', 'true'); }
  function step(n) { if (view.length) openLb((cur + n + view.length) % view.length); }
  $('#lbX').onclick = closeLb; $('#lbPrev').onclick = () => step(-1); $('#lbNext').onclick = () => step(1);
  $('#lb').onclick = (e) => { if (e.target === $('#lb')) closeLb(); };
  $('#lbCopy').onclick = () => copy(url(view[cur]), 'Link copiado');
  $('#lbCopyName').onclick = () => copy(view[cur].name, 'Nome copiado');
  grid.addEventListener('click', (e) => { const c = e.target.closest('.item:not(.skel)'); if (c) openLb(+c.dataset.i); });
  grid.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const c = e.target.closest('.item'); if (c) openLb(+c.dataset.i); } });

  /* ---------- efeitos (cursor de vidro, tilt, logo 3D) ---------- */
  if (fine && !reduced) {
    const cursor = $('#cursorGlass'), logo = document.querySelector('.logo');
    let mx = innerWidth / 2, my = innerHeight / 2, cx = mx, cy = my;
    document.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; const x = (innerWidth / 2 - mx) / 40, y = (innerHeight / 2 - my) / 40; logo.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`; });
    (function follow() { cx += (mx - cx) * .14; cy += (my - cy) * .14; cursor.style.left = cx + 'px'; cursor.style.top = cy + 'px'; requestAnimationFrame(follow); })();
    grid.addEventListener('mouseover', (e) => { if (e.target.closest('.item:not(.skel)')) cursor.classList.add('active'); });
    grid.addEventListener('mouseout', (e) => { const c = e.target.closest('.item'); if (c) { cursor.classList.remove('active'); c.style.transform = ''; } });
    grid.addEventListener('mousemove', (e) => {
      const c = e.target.closest('.item:not(.skel)'); if (!c) return;
      const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      c.style.transform = `perspective(900px) rotateX(${-y * 7}deg) rotateY(${x * 7}deg) translateY(-6px) scale(1.02)`;
    });
  }

  /* ---------- voltar com transição ---------- */
  $('#back').addEventListener('click', (e) => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    const r = e.currentTarget.getBoundingClientRect(), t = $('#pageTransition');
    t.style.setProperty('--tx', r.left + r.width / 2 + 'px'); t.style.setProperty('--ty', r.top + r.height / 2 + 'px');
    document.body.classList.add('leaving'); requestAnimationFrame(() => t.classList.add('go'));
    const href = e.currentTarget.href; setTimeout(() => (location.href = href), 720);
  });

  /* ---------- início ---------- */
  skeleton();
  document.fonts && document.fonts.ready.then(movePill); movePill();
  load().then((l) => { items = l.sort((a, b) => a.name.localeCompare(b.name, 'pt')); render(); })
    .catch((e) => { $('#count').textContent = 'erro'; grid.innerHTML = `<div class="empty">Não foi possível carregar a lista (${esc(e.message)}).<br>Confira se o repositório <code>${REPO}</code> é público.</div>`; });
})();
</script>
</body>
</html>
